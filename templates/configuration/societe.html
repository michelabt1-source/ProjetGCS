{% extends "base.html" %}
{% block content %}
<div style="max-width:760px">
  <h1 style="font-size:22px;font-weight:700;color:#0f172a;margin-bottom:6px">Société GCS</h1>
  <p style="color:#64748b;font-size:13px;margin-bottom:28px">Informations de l'établissement</p>

  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="card" style="margin-bottom:20px">
      <h3 style="font-size:14px;font-weight:700;color:#0f172a;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid #f1f5f9">Identification</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        <div style="grid-column:1/-1;display:flex;align-items:center;gap:16px">
          {% if societe.logo %}
          <img src="{{ societe.logo.url }}" alt="Logo société" style="width:64px;height:64px;object-fit:contain;border:1px solid #e2e8f0;border-radius:8px;background:#fff">
          {% else %}
          <div style="width:64px;height:64px;border:1px dashed #cbd5e1;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:10px;text-align:center">Aucun logo</div>
          {% endif %}
          <div style="flex:1">
            <label style="font-size:12px;font-weight:600;color:#475569;display:block;margin-bottom:6px">Logo société</label>
            <input type="file" name="logo" accept="image/*" style="width:100%;padding:7px 10px;border:1px solid #e2e8f0;border-radius:8px;font-size:12.5px;outline:none;background:#fff;color:#1e293b">
          </div>
        </div>
        <div style="grid-column:1/-1">
          <label style="font-size:12px;font-weight:600;color:#475569;display:block;margin-bottom:6px">Nom de l'établissement *</label>
          <input name="nom" value="{{ societe.nom|default:'' }}" required style="width:100%;padding:9px 14px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;outline:none">
        </div>
        <div>
          <label style="font-size:12px;font-weight:600;color:#475569;display:block;margin-bottom:6px">Téléphone</label>
          <input name="telephone" value="{{ societe.telephone|default:'' }}" style="width:100%;padding:9px 14px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;outline:none">
        </div>
        <div>
          <label style="font-size:12px;font-weight:600;color:#475569;display:block;margin-bottom:6px">Email</label>
          <input name="email" type="email" value="{{ societe.email|default:'' }}" style="width:100%;padding:9px 14px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;outline:none">
        </div>
        <div>
          <label style="font-size:12px;font-weight:600;color:#475569;display:block;margin-bottom:6px">Fax</label>
          <input name="fax" value="{{ societe.fax|default:'' }}" style="width:100%;padding:9px 14px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;outline:none">
        </div>
        <div>
          <label style="font-size:12px;font-weight:600;color:#475569;display:block;margin-bottom:6px">Ville</label>
          <input name="ville" value="{{ societe.ville|default:'' }}" style="width:100%;padding:9px 14px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;outline:none">
        </div>
        <div style="grid-column:1/-1">
          <label style="font-size:12px;font-weight:600;color:#475569;display:block;margin-bottom:6px">Adresse</label>
          <input name="adresse" value="{{ societe.adresse|default:'' }}" style="width:100%;padding:9px 14px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;outline:none">
        </div>
        <div style="grid-column:1/-1">
          <label style="font-size:12px;font-weight:600;color:#475569;display:block;margin-bottom:6px">Ministère de tutelle</label>
          <input name="ministere" value="{{ societe.ministere|default:'' }}" style="width:100%;padding:9px 14px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;outline:none">
        </div>
      </div>
    </div>

    <div class="card" style="margin-bottom:24px">
      <h3 style="font-size:14px;font-weight:700;color:#0f172a;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid #f1f5f9">Responsables</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        <div>
          <label style="font-size:12px;font-weight:600;color:#475569;display:block;margin-bottom:6px">Administrateur</label>
          <input name="administrateur" value="{{ societe.administrateur|default:'' }}" style="width:100%;padding:9px 14px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;outline:none">
        </div>
        <div>
          <label style="font-size:12px;font-weight:600;color:#475569;display:block;margin-bottom:6px">Comptable</label>
          <input name="comptable" value="{{ societe.comptable|default:'' }}" style="width:100%;padding:9px 14px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;outline:none">
        </div>
        <div>
          <label style="font-size:12px;font-weight:600;color:#475569;display:block;margin-bottom:6px">Réceptionnaire</label>
          <input name="receptionnaire" value="{{ societe.receptionnaire|default:'' }}" style="width:100%;padding:9px 14px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;outline:none">
        </div>
        <div>
          <label style="font-size:12px;font-weight:600;color:#475569;display:block;margin-bottom:6px">Responsable</label>
          <input name="responsable" value="{{ societe.responsable|default:'' }}" style="width:100%;padding:9px 14px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;outline:none">
        </div>
      </div>
    </div>

    <div style="display:flex;gap:12px;align-items:center">
      <button class="btn-primary" type="submit">Enregistrer</button>
      {% if societe %}
      <a href="?delete=1" onclick="return confirm('Supprimer la société ?')" style="font-size:12px;color:#ef4444;text-decoration:none;font-weight:600">Supprimer</a>
      {% endif %}
    </div>
  </form>
</div>
{% endblock %}
