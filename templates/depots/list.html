{% extends 'base.html' %}
{% block content %}
<div class="flex items-center justify-between mb-6">
  <h2 class="text-xl font-bold text-slate-800">Dépôts</h2>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
  {% for depot in depots %}
  <div class="card hover:shadow-md transition-shadow">
    <div class="flex items-center gap-4 mb-4">
      <div class="w-12 h-12 bg-primary-100 rounded-xl flex items-center justify-center">
        <svg class="w-6 h-6 text-primary-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
        </svg>
      </div>
      <div>
        <h3 class="font-bold text-slate-800 text-lg">{{ depot.code }}</h3>
        <p class="text-sm text-slate-500">{{ depot.nb_articles }} article{{ depot.nb_articles|pluralize }} en stock</p>
      </div>
    </div>
    <a href="{% url 'matieres:stock_depot_list' %}?depot={{ depot.code }}" class="text-primary-600 hover:text-primary-700 text-sm font-medium">Voir le stock →</a>
  </div>
  {% empty %}
  <p class="text-slate-400 col-span-3">Aucun dépôt enregistré.</p>
  {% endfor %}
</div>
{% endblock %}
