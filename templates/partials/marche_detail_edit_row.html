<tr>
  <td colspan="9" class="p-3 bg-indigo-50">
    <form hx-post="{% url 'matieres:htmx_marche_update_detail' detail_pk=detail.pk %}" hx-target="#marche-detail-rows" hx-swap="innerHTML" class="marches-edit-grid">
      {% csrf_token %}
      <div class="relative md:col-span-2">
        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Désignation</label>
        <input id="marche-edit-designation-{{ detail.pk }}" name="designation" value="{{ detail.designation }}" required autocomplete="off"
               hx-get="{% url 'matieres:htmx_marche_produit_search' %}?target=edit"
               hx-trigger="load, keyup changed delay:250ms" hx-target="#marche-edit-results-{{ detail.pk }}"
               class="w-full px-2 py-1.5 border border-slate-200 rounded text-sm">
        <input type="hidden" name="produit_id" id="marche-edit-produit-id-{{ detail.pk }}" value="{{ detail.produit_id|default:'' }}">
        <div id="marche-edit-results-{{ detail.pk }}" class="absolute z-30 left-0 right-0 mt-1 bg-white border border-slate-200 rounded shadow-lg overflow-hidden"></div>
      </div>
      <div><label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Nomenclature</label><input name="nomenclature" id="marche-edit-nomenclature-{{ detail.pk }}" value="{{ detail.nomenclature }}" class="w-full px-2 py-1.5 border border-slate-200 rounded text-sm"></div>
      <div><label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Spécification</label><input name="specification" id="marche-edit-specification-{{ detail.pk }}" value="{{ detail.specification }}" class="w-full px-2 py-1.5 border border-slate-200 rounded text-sm"></div>
      <div><label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Qté</label><input type="number" min="0" name="qte" value="{{ detail.qte }}" class="w-full px-2 py-1.5 border border-slate-200 rounded text-sm"></div>
      <div><label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Prix HT</label><input type="number" min="0" step="0.01" name="prix_ht" id="marche-edit-prix-ht-{{ detail.pk }}" value="{{ detail.prix_ht }}" oninput="calcMarcheEditTtcFromHt('{{ detail.pk }}')" class="w-full px-2 py-1.5 border border-slate-200 rounded text-sm"></div>
      <div><label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Prix TTC <span class="font-normal text-emerald-600">18%</span></label><input type="number" min="0" step="0.01" name="prix_ttc" id="marche-edit-prix-ttc-{{ detail.pk }}" value="{{ detail.prix_ttc }}" oninput="calcMarcheEditHtFromTtc('{{ detail.pk }}')" class="w-full px-2 py-1.5 border border-emerald-200 rounded text-sm text-emerald-700"></div>
      <div class="flex gap-1 min-w-0">
        <select name="unite_id" id="marche-edit-unite-{{ detail.pk }}" class="w-full px-2 py-1.5 border border-slate-200 rounded text-sm">
          <option value="">—</option>
          {% for unite in unites %}<option value="{{ unite.pk }}" {% if detail.unite_id == unite.pk %}selected{% endif %}>{{ unite.libelle }}</option>{% endfor %}
        </select>
        <button type="button" class="px-2 py-1.5 bg-white text-slate-600 border border-slate-300 rounded text-xs whitespace-nowrap"
          hx-get="{% url 'matieres:htmx_marche_detail_row' detail_pk=detail.pk %}" hx-target="closest tr" hx-swap="outerHTML">Annuler</button>
        <button type="submit" class="px-2 py-1.5 bg-indigo-600 text-white rounded text-xs whitespace-nowrap">OK</button>
      </div>
    </form>
  </td>
</tr>
