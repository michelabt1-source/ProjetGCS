{% for p in produits %}
<div class="px-3 py-2 cursor-pointer hover:bg-indigo-50 border-b border-slate-100 last:border-0"
     onclick="bcsPickProduit('{{ p.pk }}','{{ p.designation|escapejs }}','{{ p.nomenclature|escapejs }}','{{ p.specification|escapejs }}','{{ p.unite_id|default:'' }}','{{ p.unite.libelle|default:''|escapejs }}')">
  <div class="text-sm font-medium text-slate-800 truncate">{{ p.designation }}</div>
  <div class="text-xs text-slate-500">{{ p.nomenclature }}{% if p.specification %} — {{ p.specification }}{% endif %}</div>
</div>
{% empty %}
<div class="px-3 py-3 text-center text-xs text-slate-400">Aucun produit trouvé</div>
{% endfor %}
