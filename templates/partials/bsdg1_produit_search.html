{% for p in produits %}
<div class="prod-item"
     onclick="bsdg1PickProduit('{{ p.pk }}','{{ p.designation|escapejs }}','{{ p.nomenclature|escapejs }}','{{ p.specification|escapejs }}','{{ p.unite_id|default:'' }}','{{ p.unite.libelle|default:''|escapejs }}',{{ p.stock_disponible }},{{ p.auto_prix_ht|default:0|floatformat:"2u" }},{{ p.auto_prix_ttc|default:0|floatformat:"2u" }})">
  <div style="flex:1;min-width:0">
    <div style="font-size:13px;font-weight:600;color:#1e293b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ p.designation }}</div>
    <div style="font-size:11px;color:#64748b;margin-top:1px">
      <span style="font-family:monospace;color:#5b21b6;font-weight:700">{{ p.nomenclature }}</span>
      {% if p.unite %} · {{ p.unite }}{% endif %}
    </div>
  </div>
  <span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;flex-shrink:0;background:#ede9fe;color:#5b21b6">
    Dispo : {{ p.stock_disponible }}
  </span>
</div>
{% empty %}
<div style="padding:16px;text-align:center;color:#94a3b8;font-size:12px">Aucun produit Groupe 1 trouvé</div>
{% endfor %}
