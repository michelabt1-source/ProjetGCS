{% for p in produits %}
<button type="button"
  onclick="{% if target == 'edit' %}selectMarcheEditProduit{% else %}selectMarcheProduit{% endif %}('{{ p.pk }}', '{{ p.designation|escapejs }}', '{{ p.nomenclature|escapejs }}', '{{ p.specification|escapejs }}', '{{ p.unite_id|default:'' }}')"
        class="w-full text-left px-3 py-2 hover:bg-indigo-50 border-b border-slate-100 last:border-b-0">
  <span class="block text-sm font-semibold text-slate-700 truncate">{{ p.designation }}</span>
  <span class="block text-xs text-slate-500">{{ p.nomenclature }}{% if p.specification %} — {{ p.specification }}{% endif %}{% if p.unite %} · {{ p.unite.libelle }}{% endif %}</span>
</button>
{% empty %}
<div class="px-3 py-3 text-center text-xs text-slate-400">Aucun produit trouvé</div>
{% endfor %}
