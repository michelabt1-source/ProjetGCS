{% comment %}
  Catalogue produit (fenêtre modale) du volet de saisie — script : static/js/article-saisie.js.
{% endcomment %}
<!-- ══ MODAL SÉLECTION PRODUIT ══ -->
<div id="produit-modal-overlay" onclick="closeModalOnBg(event)">
  <div id="produit-modal-box">

    <div id="produit-modal-header">
      <div style="width:34px;height:34px;background:linear-gradient(135deg,#6366f1,#7c3aed);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <svg width="16" height="16" fill="none" stroke="#fff" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/>
        </svg>
      </div>
      <div>
        <div style="font-size:14px;font-weight:700;color:#1e293b">Sélection d'un produit</div>
        <div style="font-size:11.5px;color:#64748b">Cliquez sur un produit pour le sélectionner</div>
      </div>
      <button type="button" onclick="closeProduitModal()"
              style="margin-left:auto;width:30px;height:30px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;color:#64748b;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all 140ms"
              onmouseover="this.style.background='#fef2f2';this.style.color='#ef4444'"
              onmouseout="this.style.background='#fff';this.style.color='#64748b'">×</button>
    </div>

    <div id="modal-search-wrap">
      <input type="text" id="modal-search-input"
             placeholder="Rechercher par désignation ou nomenclature…"
             autocomplete="off"
             hx-get="{% url 'matieres:htmx_be_modal_produits' %}"
             hx-trigger="keyup changed delay:250ms"
             hx-target="#modal-product-list"
             name="q">
    </div>

    <div id="modal-product-list">
      <div style="padding:32px;text-align:center;color:#94a3b8;font-size:13px">
        <svg width="28" height="28" fill="none" stroke="#cbd5e1" viewBox="0 0 24 24" stroke-width="1.5" style="margin:0 auto 10px;display:block">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
        Chargement…
      </div>
    </div>

  </div>
</div>
